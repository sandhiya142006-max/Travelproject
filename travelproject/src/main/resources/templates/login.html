<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Project - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: #f4f8fc;
}
       

        .login-container {
            width: 400px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);

            text-align: center;
        }

        .logo {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            color: #1677ff;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #1677ff;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-button:hover {
            background: #005edb;
            transform: translateY(-2px);
        }

        .travel-text {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 500px) {

            .login-container {
                width: 90%;
                padding: 30px 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">✈️</div>

        <h1>Travel Project</h1>

        <p class="subtitle">
            Plan your journey. Explore the world.
        </p>

       <form action="/login" method="post" autocomplete="off">

    <div class="input-group">
        <label>📧 Email Address</label>

        <input
    type="email"
    name="email"
    autocomplete="username"
    placeholder="Enter your email address"
    required>
    </div>

    <div class="input-group">
        <label>🔐 Password</label>

        <input
    type="password"
    name="password"
    autocomplete="current-password"
    placeholder="Enter your password"
    required>
    </div>

    <button type="submit" class="login-button">
        Login ✈️
    </button>

</form>

<p style="margin-top: 20px; color: #777;">
    Don't have an account?
    <a href="/register"
       style="color: #1677ff; font-weight: bold; text-decoration: none;">
        Create Account
    </a>
</p>

        <p class="travel-text">
            🌍 Your next adventure starts here
        </p>

    </div>

</body>

</html>
